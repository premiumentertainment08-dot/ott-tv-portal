<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY OTT TV</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial}header{padding:18px 22px;background:#111}.wrap{max-width:1200px;margin:auto;padding:20px}.card{max-width:520px;margin:40px auto;background:#121212;border:1px solid #333;border-radius:14px;padding:20px}input,button{width:100%;padding:15px;margin:7px 0;border-radius:9px;border:1px solid #333;background:#1b1b1b;color:#fff;font-size:18px}button{background:#fff;color:#000;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}.item{background:#151515;border-radius:12px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}.pad{padding:10px}.muted{color:#aaa;font-size:13px}.hidden{display:none}video{width:100%;max-height:65vh;background:#000;border-radius:12px;margin-bottom:20px}</style></head>
<body><header>🎬 <b>MY OTT</b></header><div class="wrap">
<section id="login" class="card"><h2>TV Activation</h2><p class="muted">Admin से मिला 6-digit code डालें.</p><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button onclick="activate()">Activate TV</button><p id="err" class="muted"></p></section>
<section id="home" class="hidden"><video id="player" controls playsinline></video><div id="grid" class="grid"></div></section></div>
<script>
const API=(localStorage.api||'https://ott-tv-portal.onrender.com').replace(/\/+$/,'');
function did(){if(!localStorage.deviceId)localStorage.deviceId='tv-'+crypto.randomUUID();return localStorage.deviceId}
async function activate(){err.textContent='';if(code.value.length!==6)return err.textContent='6-digit code डालें';try{let r=await fetch(API+'/tv/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value,device_id:did(),name:'TV'})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Activation failed');localStorage.token=d.token;homePage()}catch(e){err.textContent=e.message}}
async function homePage(){if(!localStorage.token)return;try{let r=await fetch(API+'/tv/content',{headers:{Authorization:'Bearer '+localStorage.token}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load content');login.classList.add('hidden');home.classList.remove('hidden');grid.innerHTML=d.length?d.map(x=>'<div class="item" onclick="play('+JSON.stringify(x.video_url||'')+')"><img class="poster" src="'+E(x.poster_url||'')+'"><div class="pad"><b>'+E(x.title)+'</b><div class="muted">'+E(x.category||'')+'</div></div></div>').join(''):'<p class="muted">No content available.</p>'}catch(e){localStorage.removeItem('token');err.textContent=e.message}}
function play(u){if(!u)return alert('इस content का video URL नहीं है.');player.src=u;player.play().catch(()=>{})}
function E(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
homePage();
</script></body></html>
