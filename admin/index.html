
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTT TV Portal - Admin</title>
  
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial}
header{padding:18px;background:#111;border-bottom:1px solid #333}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#121212;border:1px solid #292929;border-radius:14px;padding:16px;margin-bottom:16px}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #383838;background:#1b1b1b;color:#fff}
button{background:#fff;color:#000;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border-top:1px solid #333;padding:12px 0}
.muted{color:#aaa;font-size:13px}
.code{font-size:30px;letter-spacing:5px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>🎬 <b>OTT TV Portal — Admin Panel</b></header>

<main>

<section class="card">
<h3>⚙️ Backend Settings</h3>

<input id="api" value="https://ott-tv-portal.onrender.com"
placeholder="Backend URL">

<input id="key" type="password"
placeholder="ADMIN_KEY">

<button onclick="save()">Save Settings</button>
</section>

<section class="card">
<h3>📺 TV Activation Code</h3>

<button onclick="newCode()">Generate 6-Digit Code</button>

<div id="nc"></div>
</section>

<section class="card">
<h3>➕ Add Content</h3>

<div class="row">
<input id="title" placeholder="Title">

<select id="kind">
<option value="movie">Movie</option>
<option value="series">Series</option>
<option value="channel">Channel</option>
</select>
</div>

<input id="cat" placeholder="Category">

<textarea id="desc" placeholder="Description"></textarea>

<input id="poster" placeholder="Poster URL">

<input id="video" placeholder="Video / Stream URL">

<button onclick="add()">Add Content</button>
</section>

<section class="card">
<h3>📚 Content List</h3>

<button onclick="contents()">Refresh</button>

<div id="cl">Loading...</div>
</section>

<section class="card">
<h3>📱 TV Devices</h3>

<button onclick="devices()">Refresh</button>

<div id="dl">Loading...</div>
</section>

</main>

<script>

const A=document.getElementById('api');
const K=document.getElementById('key');

A.value=localStorage.api||'https://ott-tv-portal.onrender.com';
K.value=localStorage.adminKey||'';

function save(){
localStorage.api=A.value;
localStorage.adminKey=K.value;
alert('Settings saved');
contents();
devices();
}

function H(){
return {
'Content-Type':'application/json',
'X-Admin-Key':K.value
};
}

async function R(u,o={}){
let r=await fetch(
A.value.replace(/\/+$/,'')+u,
o
);

let d={};

try{
d=await r.json();
}catch{}

if(!r.ok)
throw Error(d.detail||'Request failed');

return d;
}

async function newCode(){

try{

let d=await R('/admin/devices',{
method:'POST',
headers:H()
});

nc.innerHTML=
'<p class="code">'+d.code+'</p>'+
'<small class="muted">यह code TV पर डालें.</small>';

devices();

}catch(e){
alert(e.message);
}

}

async function add(){

if(!title.value.trim())
return alert('Title डालें');

try{

await R('/admin/content',{
method:'POST',
headers:H(),
body:JSON.stringify({
title:title.value,
kind:kind.value,
category:cat.value||'Featured',
description:desc.value,
poster_url:poster.value,
video_url:video.value
})
});

alert('Content added');

['title','cat','desc','poster','video']
.forEach(x=>document.getElementById(x).value='');

contents();

}catch(e){
alert(e.message);
}

}

async function contents(){

try{

let a=await R('/admin/content',{
headers:H()
});

cl.innerHTML=a.length?

a.map(x=>
'<div class="item">'+
'<b>'+E(x.title)+'</b><br>'+
'<small class="muted">'+
E(x.kind)+' • '+E(x.category)+
'</small><br>'+
'<button onclick="del('+x.id+')">Delete</button>'+
'</div>'
).join('')

:'No content';

}catch(e){

cl.innerHTML=
'<span class="muted">'+e.message+'</span>';

}

}

async function del(id){

if(!confirm('Delete?'))
return;

try{

await R('/admin/content/'+id,{
method:'DELETE',
headers:H()
});

contents();

}catch(e){
alert(e.message);
}

}

async function devices(){

try{

let a=await R('/admin/devices',{
headers:H()
});

dl.innerHTML=a.length?

a.map(x=>
'<div class="item">'+
'<b>Code: '+E(x.code)+'</b><br>'+
'<small class="muted">'+
E(x.device_id||'-')+
' • '+
(x.active?'ACTIVE':'INACTIVE')+
'</small><br>'+
'<button onclick="toggle('+x.id+','+x.active+')">'+
(x.active?'Deactivate':'Activate')+
'</button>'+
'</div>'
).join('')

:'No devices';

}catch(e){

dl.innerHTML=
'<span class="muted">'+e.message+'</span>';

}

}

async function toggle(id,a){
  try{
  await R('/admin/devices/'+id+'/'+(a?'deactivate':'activate'),{
    method:'POST',
    headers:H()
  });
  devices();
}catch(e){
  alert(e.message);
}
}

function E(s){
  return String(s??'').replace(/[&<>"']/g,function(c){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c];
  });
}

contents();
devices();
</script>
</body>
</html>
